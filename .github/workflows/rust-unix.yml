name: Rust port — Linux · Mac build (rust-port)

# 2단계(계획서 13절): 리눅스 CLI(logiflow-rs) · Mac 앱. rust-port 브랜치에서만, 릴리스는 내지 않는다(main 이 초안에 올림).
on:
  push:
    branches: [rust-port]
    paths:
      - 'rust/**'
      - '.github/workflows/rust-unix.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-unix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Cross linker for arm64
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools gcc-aarch64-linux-gnu
      - name: Resolve version
        id: version
        run: |
          V=$(grep -m1 '^version = ' rust/Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Format, lint, tests
        working-directory: rust
        run: |
          cargo fmt --all -- --check
          cargo clippy -p logiflow-core -p logiflow-linux -p logiflow-mac --all-targets -- -D warnings
          cargo test -p logiflow-core -p logiflow-linux -p logiflow-mac
      - name: Build x64 + arm64 (static musl — runs on any distro)
        working-directory: rust
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release -p logiflow-linux --target x86_64-unknown-linux-musl
          cargo build --release -p logiflow-linux --target aarch64-unknown-linux-musl
          file target/x86_64-unknown-linux-musl/release/logiflow-rs target/aarch64-unknown-linux-musl/release/logiflow-rs
      - name: CLI smoke (no devices on runner)
        run: |
          B=rust/target/x86_64-unknown-linux-musl/release/logiflow-rs
          $B --version
          $B selftest
          $B --help
          # 장치 없는 러너: 안내 후 종료코드 1 이 정상(C# 판과 같음).
          set +e; $B list; c=$?; $B 2; d=$?; set -e
          echo "list exit=$c · switch exit=$d"; test "$c" = 1; test "$d" = 1
      - name: Package tar.gz
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out
          for ARCH in x64 arm64; do
            T=$([ "$ARCH" = x64 ] && echo x86_64 || echo aarch64)-unknown-linux-musl
            NAME="LogiFlowRs-v${VERSION}-linux-${ARCH}"
            mkdir -p "stage/$NAME"
            cp "rust/target/$T/release/logiflow-rs" "stage/$NAME/"
            cp rust/packaging/linux/* "stage/$NAME/"
            chmod +x "stage/$NAME/logiflow-rs" "stage/$NAME/"*.sh
            tar -C stage -czf "out/$NAME.tar.gz" "$NAME"
            tar -tzf "out/$NAME.tar.gz"
          done
          (cd out && sha256sum *.tar.gz > "LogiFlowRs-v${VERSION}-linux-SHA256SUMS.txt" && cat *.txt)
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: LogiFlowRs-linux-${{ steps.version.outputs.version }}
          path: out/*
          if-no-files-found: error
          compression-level: 0

  mac:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Resolve version
        id: version
        run: |
          V=$(grep -m1 '^version = ' rust/Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Format, lint, tests
        working-directory: rust
        run: |
          cargo fmt --all -- --check
          cargo clippy -p logiflow-mac -p logiflow-ui -p logiflow-app --all-targets --target aarch64-apple-darwin -- -D warnings
          cargo clippy -p logiflow-mac -p logiflow-ui -p logiflow-app --target x86_64-apple-darwin -- -D warnings
          cargo test -p logiflow-core -p logiflow-mac
      - name: Build arm64 + x64 → universal
        working-directory: rust
        run: |
          set -euo pipefail
          cargo build --release -p logiflow-app --target aarch64-apple-darwin
          cargo build --release -p logiflow-app --target x86_64-apple-darwin
          mkdir -p ../mac-build
          lipo -create -output ../mac-build/LogiFlowRs \
            target/aarch64-apple-darwin/release/LogiFlowRs target/x86_64-apple-darwin/release/LogiFlowRs
          lipo -info ../mac-build/LogiFlowRs
          ls -la ../mac-build
      - name: Package .app · dmg · zip (unsigned — ad-hoc only)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: rust/packaging/mac/make-app.sh "$PWD/mac-build/LogiFlowRs" "$VERSION" "$PWD/mac-out/out"
      - uses: actions/upload-artifact@v4
        with:
          name: LogiFlow-mac-${{ steps.version.outputs.version }}
          path: mac-out/out/*
          if-no-files-found: error
          compression-level: 0
      - name: Smoke — menu bar agent · Swift settings import · IPC · login item · second launch opens settings
        run: rust/ci/mac-smoke.sh "$PWD/mac-out/app-under-test/LogiFlowRs.app" "$PWD/mac-shots"
      - name: Settings window snapshots (same screens as Windows)
        continue-on-error: true
        timeout-minutes: 8
        run: |
          set -euo pipefail
          mkdir -p mac-shots/ui
          "$PWD/mac-out/app-under-test/LogiFlowRs.app/Contents/MacOS/LogiFlowRs" --ui-snapshot="$PWD/mac-shots/ui" &
          P=$!
          for _ in $(seq 1 240); do kill -0 "$P" 2>/dev/null || break; sleep 0.5; done
          if kill -0 "$P" 2>/dev/null; then kill "$P"; fi
          ls -la mac-shots/ui | head -80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LogiFlow-mac-snapshots-${{ steps.version.outputs.version }}
          path: mac-shots/
          if-no-files-found: warn
