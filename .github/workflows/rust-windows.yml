name: Rust port — Windows build (rust-port)

# 러스트 시험판(rust/) 빌드·시험·설치 파일. rust-port 브랜치에서만 돈다. 릴리스는 내지 않는다
# (master/main 합치기·릴리스는 회장님 PC 확인 뒤 main 판단). 기존 워크플로 4개와 무관.
on:
  push:
    branches: [rust-port]
    paths:
      - 'rust/**'
      - '.github/workflows/rust-windows.yml'
      - 'LogiFlow/Resources/logiflow.ico'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Core tests (OS-independent)
        working-directory: rust
        run: cargo test -p logiflow-core

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $text = Get-Content rust/Cargo.toml -Raw
          $v = [regex]::Match($text, '(?m)^version = "([^"]+)"').Groups[1].Value
          if ($v -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(-rs\.[0-9]+)?$') { throw "bad version $v" }
          $core, $pre = $v.Split('-', 2)
          $n = if ($pre) { $pre.Split('.')[-1] } else { '0' }
          "version=$v" >> $env:GITHUB_OUTPUT
          "file_version=$core.$n" >> $env:GITHUB_OUTPUT

      - name: Format and lint
        working-directory: rust
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --target x86_64-pc-windows-msvc -- -D warnings

      - name: Tests (core on Windows)
        working-directory: rust
        run: cargo test -p logiflow-core

      - name: Clipboard frame = C# (.NET Framework) bytes
        shell: powershell
        run: ./rust/ci/clip-vector.ps1

      - name: Release build x64 + arm64
        working-directory: rust
        run: |
          cargo build --release --target x86_64-pc-windows-msvc -p logiflow-app
          cargo build --release --target aarch64-pc-windows-msvc -p logiflow-app

      - name: Stage
        shell: pwsh
        run: |
          New-Item rust/dist/x64, rust/dist/arm64 -ItemType Directory -Force | Out-Null
          Copy-Item rust/target/x86_64-pc-windows-msvc/release/LogiFlowRs.exe rust/dist/x64/
          Copy-Item rust/target/aarch64-pc-windows-msvc/release/LogiFlowRs.exe rust/dist/arm64/
          Get-ChildItem rust/dist -Recurse -File | ForEach-Object { "{0,-40} {1,10:N0} bytes" -f $_.FullName.Replace((Get-Location).Path, ''), $_.Length }

      # 실행 시험은 배포 폴더(rust/dist)가 아니라 임시 사본에서 — 실행 파일 옆에 생기는 logs/ 가 zip 에 들어가지 않게
      # (rs.3 zip 에 x64/logs/logiflow-diag.log 가 섞여 나감).
      - name: Startup smoke test (no devices on runner)
        shell: pwsh
        run: |
          $run = Join-Path $env:RUNNER_TEMP 'lf-run'
          New-Item $run -ItemType Directory -Force | Out-Null
          Copy-Item rust/dist/x64/LogiFlowRs.exe $run/
          ./rust/ci/smoke.ps1 -Exe "$run/LogiFlowRs.exe"

      - name: Legacy (C#) cleanup — real 0.15.0 install + simulated pre-logon leftovers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./rust/ci/legacy-cleanup.ps1 -Exe "$env:RUNNER_TEMP/lf-run/LogiFlowRs.exe"

      - name: Settings window snapshots (3 screens × light/dark)
        shell: pwsh
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath "$env:RUNNER_TEMP/lf-run/LogiFlowRs.exe" -ArgumentList "--ui-snapshot=$pwd/rust/snapshots" -PassThru
          if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force; Write-Host 'snapshot timeout' }
          Get-ChildItem rust/snapshots -ErrorAction SilentlyContinue | ForEach-Object { $_.Name }

      - name: Package inputs are only the executables
        shell: pwsh
        run: |
          $extra = Get-ChildItem rust/dist/x64, rust/dist/arm64 -Recurse -Force | Where-Object { $_.Name -ne 'LogiFlowRs.exe' }
          if ($extra) { $extra | ForEach-Object { Write-Host "unexpected: $($_.FullName)" }; throw 'dist has files other than LogiFlowRs.exe' }
          Write-Host 'dist: x64/LogiFlowRs.exe + arm64/LogiFlowRs.exe only'

      - name: Installer, ZIP, checksums
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FILE_VERSION: ${{ steps.version.outputs.file_version }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$env:VERSION" "/DFileVersion=$env:FILE_VERSION" "/DDistDir=..\dist" "/DOutputDir=..\out" "rust/installer/LogiFlowRs.iss"
          if ($LASTEXITCODE -ne 0) { throw 'Installer compile failed' }
          # 배포 이름(0.16.0~ Windows 기본 판): C# 판 릴리스와 같은 꼴 — LogiFlow-v<판>-setup.exe · -win.zip · -SHA256SUMS.txt,
          # 정식 판(접미사 없음)은 고정 이름 LogiFlow-windows-setup.exe 사본도(README 의 releases/latest/download 링크).
          $zip = "rust/out/LogiFlow-v$env:VERSION-win.zip"
          Compress-Archive -Path rust/dist/x64, rust/dist/arm64 -DestinationPath $zip -Force
          $names = @("LogiFlow-v$env:VERSION-setup.exe", "LogiFlow-v$env:VERSION-win.zip")
          if ($env:VERSION -notmatch '-') {
            Copy-Item "rust/out/LogiFlow-v$env:VERSION-setup.exe" rust/out/LogiFlow-windows-setup.exe
            $names += 'LogiFlow-windows-setup.exe'
          }
          $lines = foreach ($n in $names) { $h = (Get-FileHash "rust/out/$n" -Algorithm SHA256).Hash.ToLowerInvariant(); "$h  $n" }
          $lines | Set-Content "rust/out/LogiFlow-v$env:VERSION-SHA256SUMS.txt" -Encoding utf8
          Get-Content "rust/out/LogiFlow-v$env:VERSION-SHA256SUMS.txt"
          Get-ChildItem rust/out | ForEach-Object { "{0,-44} {1,12:N0} bytes" -f $_.Name, $_.Length }
          # zip 안에 로그가 섞이면 실패(실행 파일 2개만 있어야 함).
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          $names = $z.Entries | ForEach-Object { $_.FullName.Replace('\','/') }
          $z.Dispose()
          $names | ForEach-Object { Write-Host "  zip: $_" }
          $bad = $names | Where-Object { $_ -match '(^|/)logs/' -or $_ -match '\.log$' }
          if ($bad) { throw "zip contains logs: $($bad -join ', ')" }
          $exes = $names | Where-Object { $_ -match 'LogiFlowRs\.exe$' }
          if ($exes.Count -ne 2) { throw "zip should hold exactly 2 executables, got $($exes.Count)" }

      # 설치·업그레이드·제거 경로(이전 C# 판 → 이 판, 제자리 업그레이드, 제거 정리).
      - name: Install / upgrade / uninstall paths
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: ./rust/ci/install-test.ps1 -Setup "$pwd/rust/out/LogiFlow-v$env:VERSION-setup.exe" -Version $env:VERSION

      - uses: actions/upload-artifact@v4
        with:
          name: LogiFlow-Windows-${{ steps.version.outputs.version }}
          path: rust/out/*
          if-no-files-found: error
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LogiFlow-snapshots-${{ steps.version.outputs.version }}
          path: rust/snapshots/*.png
          if-no-files-found: warn
